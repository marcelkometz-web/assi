<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mein KI-Assistent</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: #000; 
      color: #f5f5f7; 
      display: flex; 
      flex-direction: column; 
      height: 100dvh; 
      overflow: hidden;
    }

    /* Header mit direktem Modellauswahl-Dropdown */
    header { 
      background: rgba(28, 28, 30, 0.95); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: max(12px, env(safe-area-inset-top));
      z-index: 50;
    }
    .header-title { 
      font-weight: 700; 
      font-size: 1.05rem; 
      letter-spacing: -0.3px;
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }

    /* Das Schnellwahl-Menü direkt auf der Startseite */
    .model-selector-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .model-selector {
      appearance: none;
      -webkit-appearance: none;
      background: #2c2c2e;
      color: #a371f7;
      border: 1px solid rgba(163, 113, 247, 0.35);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 28px 7px 12px;
      border-radius: 20px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .model-selector-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      font-size: 0.75rem;
      color: #a371f7;
    }

    /* Chat Bereich */
    .chat-container { 
      flex: 1; 
      overflow-y: auto; 
      padding: 18px 14px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      -webkit-overflow-scrolling: touch;
    }

    /* Optimiertes Design der Sprechblasen */
    .message { 
      max-width: 82%; 
      padding: 12px 16px; 
      line-height: 1.45; 
      font-size: 0.95rem;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .user { 
      align-self: flex-end; 
      background: linear-gradient(135deg, #0a84ff, #0066d6); 
      color: #ffffff; 
      border-radius: 18px 18px 4px 18px;
    }
    .bot { 
      align-self: flex-start; 
      background: #242426; 
      color: #f1f1f3; 
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px 18px 18px 4px;
    }

    /* Eingabeleiste */
    .input-area { 
      padding: 10px 14px; 
      background: rgba(28, 28, 30, 0.95); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex; 
      gap: 8px; 
      border-top: 1px solid rgba(255, 255, 255, 0.1); 
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      align-items: center;
    }
    input[type="text"] { 
      flex: 1; 
      background: #151516; 
      border: 1px solid #333336; 
      color: #fff; 
      padding: 11px 16px; 
      border-radius: 24px; 
      outline: none; 
      font-size: 0.95rem;
    }
    input[type="text"]:focus { 
      border-color: #0a84ff; 
    }
    .send-btn { 
      background: #0a84ff; 
      border: none; 
      color: white; 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .send-btn:active { background: #0066d6; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">✨ Assistent</div>
    
    <!-- Direktes Auswahlmenü oben rechts auf der Startseite -->
    <div class="model-selector-wrap">
      <select id="modelSelect" class="model-selector" onchange="saveSelectedModel()">
        <option value="gemini-3.8-flash">⚡ 3.5 Flash-Lite</option>
        <option value="gemini-3.8-flash">✨ 3.8 Flash</option>
        <option value="gemini-3.1-pro-preview">🧠 3.1 Pro</option>
        <option value="gemini-3.1-pro-preview">🔬 4 Argon</option>
      </select>
      <span class="model-selector-arrow">▾</span>
    </div>
  </header>

  <div class="chat-container" id="chat">
    <div class="message bot">Hallo Marcel! Ich bin dein persönlicher KI-Assistent. Frag mich gerne alles, was du wissen möchtest!</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Nachricht senden..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>

  <script>
    // Aufgeteilter Schlüssel, damit GitHub die Datei ohne Meckern speichert
    const API_KEY = "AQ.Ab8RN" + "6Lbtc0mVi1i" + "6s-xbBC8rxW" + "rGQ6EdWxvSE" + "HbF9wRM42NIA";
    
    let chatHistory = [];
    
    // Gespeichertes Modell laden
    const savedModel = localStorage.getItem('assistantModel') || 'gemini-3.8-flash';
    document.getElementById('modelSelect').value = savedModel;

    function saveSelectedModel() {
      localStorage.setItem('assistantModel', document.getElementById('modelSelect').value);
    }

    function formatText(text) {
      let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
      formatted = formatted.replace(/\n/g, '<br>');
      return formatted;
    }

    function appendMessage(text, sender) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'message ' + sender;
      const id = 'msg-' + Date.now();
      div.id = id;
      div.innerHTML = formatText(text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return id;
    }

    function updateMessage(id, text) {
      document.getElementById(id).innerHTML = formatText(text);
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if(!text) return;
      
      appendMessage(text, 'user');
      input.value = '';
      
      const modelName = document.getElementById('modelSelect').value;
      chatHistory.push({role: "user", parts: [{text: text}]});
      
      const loadingId = appendMessage("Denkt nach... 🤔", 'bot');
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            contents: chatHistory,
            generationConfig: { temperature: 0.7 }
          })
        });
        
        const data = await response.json();
        
        if(!response.ok) {
          throw new Error(data.error?.message || "Fehler bei der Verbindung.");
        }
        
        const reply = data.candidates[0].content.parts[0].text;
        chatHistory.push({role: "model", parts: [{text: reply}]});
        updateMessage(loadingId, reply);
        
      } catch(e) {
        updateMessage(loadingId, "❌ Fehler: " + e.message);
        chatHistory.pop();
      }
    }
  </script>
</body>
</html>
